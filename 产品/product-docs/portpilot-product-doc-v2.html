<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortPilot 产品原型文档 v2.0</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --ink:#e6edf3;--muted:#8b949e;--rule:#30363d;
  --primary:#0fc6b7;--primary-dim:rgba(15,198,183,0.12);
  --accent2:#3fb950;--accent3:#e3a53c;--danger:#f85149;--purple:#a371f7;
  --font:'InstrumentSans','Noto Sans CJK SC','WenQuanYi Micro Hei',sans-serif;
  --mono:'GeistMono','JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:32px 28px}
h1{font-size:26px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
h2{font-size:20px;color:var(--primary);margin:36px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
h3{font-size:16px;margin:20px 0 8px}
h4{font-size:14px;margin:14px 0 6px}
p{margin-bottom:10px;color:var(--ink2,#c9d1d9)}
ul,ol{margin:0 0 12px 20px}
li{margin:4px 0}
code{font-family:var(--mono);background:var(--bg3);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--primary)}
.card{background:var(--bg2);border:1px solid var(--rule);border-radius:10px;padding:16px;margin:12px 0}
.card.hl{border-left:3px solid var(--primary)}
.tag{display:inline-block;font-size:10px;padding:1px 8px;border-radius:10px;font-weight:600;margin-right:4px}
.tag.p0{background:var(--danger);color:#fff}
.tag.p1{background:rgba(227,165,60,.2);color:var(--accent3)}
.tag.p2{background:var(--bg4);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{color:var(--muted);font-weight:600;background:var(--bg3);font-size:12px}
.tree{font-family:var(--mono);background:var(--bg2);border:1px solid var(--rule);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.9;overflow-x:auto}
.tree .t{color:var(--primary)}
.tree .k{color:var(--accent3)}
.tree .sync{color:var(--danger)}
.tree .off{color:var(--muted)}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.flow .step{background:var(--bg3);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:12px;text-align:center;min-width:110px}
.flow .step b{display:block;font-size:13px;color:var(--primary)}
.flow .arrow{color:var(--muted)}
.warn{background:rgba(227,165,60,.08);border:1px solid var(--accent3);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13px}
.ok{background:rgba(63,185,80,.08);border:1px solid var(--accent2);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13px}
</style>
<style>
/* ===== 统一滚动条（与 UI 原型一致） ===== */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:#161b22}
*::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px;border:2px solid #161b22}
*::-webkit-scrollbar-thumb:hover{background:#0fc6b7;border-color:#161b22}
*::-webkit-scrollbar-corner{background:#161b22}
*{scrollbar-width:thin;scrollbar-color:#30363d #161b22}
</style>
</head>
<body>
<div class="wrap">
  <h1>PortPilot 产品原型文档 v2.0</h1>
  <div class="sub">串口调试工具 · 会话/视图互斥模型 · 2026-08-13</div>

  <div class="card hl"></div></div></body></html>
